[pytest]
# Only collect repo-level integration tests from ./tests.
# Package-specific tests live next to their code and should be invoked via the
# package-level targets (e.g., `make test-db`, `make test-storage`).
testpaths = tests
norecursedirs = .venv node_modules dist build infra packages apps

# Keep output useful in CI/local runs without being noisy.

# Repo-wide markers (keep in sync with test architecture docs).
markers =
    unit: fast unit tests (no real external services)
    integration: integration tests (may use DB/storage; no external internet)
    e2e: end-to-end tests for critical flows
    slow: slow tests (opt-in for local/CI)
    docker: requires a working Docker daemon (opt-in)
    postgres: requires Postgres
    minio: requires MinIO/S3-compatible storage
    external: requires an externally-managed service outside pytest control (discouraged)

# Make marker usage strict (typos become hard failures).
addopts = -ra --strict-markers
