# Temporal dynamic config for development
# This file provides runtime configuration for Temporal server

# Frontend service configuration
frontend.enableClientVersionCheck:
  - value: true
    constraints: {}

# History service configuration  
history.persistenceMaxQPS:
  - value: 3000
    constraints: {}

# Matching service configuration
matching.numTaskqueueReadPartitions:
  - value: 4
    constraints: {}

matching.numTaskqueueWritePartitions:
  - value: 4
    constraints: {}

# Worker service configuration
worker.replicatorConcurrency:
  - value: 1000
    constraints: {}

# System limits
limit.maxIDLength:
  - value: 255
    constraints: {}

limit.blobSizeLimitError:
  - value: 2097152  # 2MB
    constraints: {}

limit.blobSizeLimitWarn:
  - value: 262144   # 256KB
    constraints: {}

# Visibility settings
system.enableVisibilitySampling:
  - value: true
    constraints: {}

system.advancedVisibilityWritingMode:
  - value: "off"
    constraints: {}
