name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  docs-guardrail:
    name: Docs guardrail (status + checklist)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce status/checklist updates when changing tests/CI/runtime
        shell: bash
        run: |
          set -euo pipefail

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          echo "Diff range:"
          echo "  base=$BASE_SHA"
          echo "  head=$HEAD_SHA"

          CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          echo "Changed files:"
          echo "$CHANGED" | sed 's/^/  - /' || true

          needs_docs=0
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            if [[ "$f" == tests/* || "$f" == .github/workflows/* || "$f" == apps/core-api/* || "$f" == apps/worker/* || "$f" == packages/* || "$f" == infra/* || "$f" == Makefile || "$f" == pytest.ini ]]; then
              needs_docs=1
            fi
          done <<< "$CHANGED"

          if [[ "$needs_docs" -eq 0 ]]; then
            echo "No tests/CI/runtime changes detected; guardrail not applicable."
            exit 0
          fi

          required_a="Docs/implementation/00_status.md"
          required_b="Docs/implementation/checklists/04_test_stabilization.md"

          missing=0
          if ! echo "$CHANGED" | grep -qx "$required_a"; then
            echo "ERROR: '$required_a' must be updated when changing tests/CI/runtime."
            missing=1
          fi
          if ! echo "$CHANGED" | grep -qx "$required_b"; then
            echo "ERROR: '$required_b' must be updated when changing tests/CI/runtime."
            missing=1
          fi

          if [[ "$missing" -ne 0 ]]; then
            echo "Guardrail failed. Update the required docs files in this PR."
            exit 1
          fi

          echo "Guardrail OK: required docs updated."

  check-stubs:
    name: Check for stubs/TODOs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check for TODO markers
        run: |
          if grep -rn "TODO" apps/core-api/*.py apps/worker/*.py 2>/dev/null | grep -v "test_" | grep -v "#.*TODO"; then
            echo "ERROR: Found TODO markers in production code"
            exit 1
          fi
          
      - name: Check for bare pass statements
        run: |
          if grep -rn "pass$" apps/core-api/*.py apps/worker/*.py 2>/dev/null | grep -v "test_" | grep -v "except.*pass" | grep -v "#.*pass"; then
            echo "ERROR: Found bare 'pass' statements in production code"
            exit 1
          fi
      
      - name: Success
        run: echo "No stubs found in production code ✓"

  smoke-test:
    name: Smoke test - boot stack and check health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Start infrastructure
        run: |
          cd infra
          docker compose up -d
          
      - name: Wait for services
        run: |
          echo "Waiting for services to be healthy..."
          sleep 30
          docker compose -f infra/docker-compose.yml ps
          
      - name: Install Python dependencies
        run: |
          cd apps/core-api
          pip install -r requirements.txt
          
      - name: Start Core API
        run: |
          cd apps/core-api
          python main.py &
          API_PID=$!
          echo "API_PID=$API_PID" >> $GITHUB_ENV
          sleep 5
          
      - name: Test health endpoint
        run: |
          response=$(curl -s http://localhost:8000/health)
          echo "Health check response: $response"
          if echo "$response" | grep -q "healthy"; then
            echo "✓ Health check passed"
          else
            echo "✗ Health check failed"
            exit 1
          fi
          
      - name: Cleanup
        if: always()
        run: |
          if [ ! -z "$API_PID" ]; then
            kill $API_PID || true
          fi
          cd infra
          docker compose down -v
