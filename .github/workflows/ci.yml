name: CI

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      run_release_gate:
        description: 'Run release tag gate job'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      run_full_e2e:
        description: 'Run nightly full CMD-13 suite job'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  docs-guardrail:
    name: Docs guardrail (status/worklog + active checklist)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce docs updates when changing tests/CI/runtime
        shell: bash
        run: |
          set -euo pipefail

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"

          echo "Diff range:"
          echo "  base=$BASE_SHA"
          echo "  head=$HEAD_SHA"
          echo "Changed files:"
          echo "$CHANGED" | sed 's/^/  - /' || true

          needs_docs=0
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            if [[ "$f" == tests/* || "$f" == .github/workflows/* || "$f" == apps/core-api/* || "$f" == apps/worker/* || "$f" == packages/* || "$f" == infra/* || "$f" == scripts/* || "$f" == Docs/artifacts/* || "$f" == Makefile || "$f" == pytest.ini ]]; then
              needs_docs=1
            fi
          done <<< "$CHANGED"

          if [[ "$needs_docs" -eq 0 ]]; then
            echo "No tests/CI/runtime changes detected; guardrail not applicable."
            exit 0
          fi

          required_status="Docs/implementation/00_status.md"
          required_worklog="Docs/implementation/03_worklog.md"
          required_alignment="Docs/implementation/checklists/08_artifact_feature_alignment.md"

          missing=0
          if ! echo "$CHANGED" | grep -qx "$required_status"; then
            echo "ERROR: '$required_status' must be updated when changing tests/CI/runtime."
            missing=1
          fi
          if ! echo "$CHANGED" | grep -qx "$required_worklog"; then
            echo "ERROR: '$required_worklog' must be updated when changing tests/CI/runtime."
            missing=1
          fi

          checklist_updates="$(echo "$CHANGED" | grep -E '^Docs/implementation/checklists/.+\.md$' || true)"
          if [[ -z "$checklist_updates" ]]; then
            echo "ERROR: at least one file under Docs/implementation/checklists/ must be updated for active packet tracking."
            missing=1
          else
            echo "Checklist updates detected:"
            echo "$checklist_updates" | sed 's/^/  - /'
          fi

          reliability_changes="$(echo "$CHANGED" | grep -E '^(apps/core-api/(artifact_routes|draft_routes|evidence_resolver|phase_routes)\.py|apps/worker/(citation_check|main)\.py|tests/integration/core_api/(test_artifacts_exit|test_drafts|test_evidence_resolver)\.py|tests/integration/worker/(test_phase_machine|test_repo_ingestion)\.py|Docs/artifacts/(index\.json|README\.md))$' || true)"
          if [[ -n "$reliability_changes" ]]; then
            echo "Reliability-critical changes detected:"
            echo "$reliability_changes" | sed 's/^/  - /'
            if ! echo "$CHANGED" | grep -qx "$required_alignment"; then
              echo "ERROR: '$required_alignment' must be updated when reliability-critical files change."
              missing=1
            fi
          fi

          alignment_checkpoint="Docs/implementation/checklists/07_alignment_review.md"
          if echo "$CHANGED" | grep -qx "$alignment_checkpoint"; then
            echo "Alignment checkpoint update detected; enforcing trigger metadata."
            if ! grep -q "Triggering delta:" "$alignment_checkpoint"; then
              echo "ERROR: '$alignment_checkpoint' must include 'Triggering delta:'."
              missing=1
            fi
            if ! grep -q "Recommended next non-redundant packet:" "$alignment_checkpoint"; then
              echo "ERROR: '$alignment_checkpoint' must include 'Recommended next non-redundant packet:'."
              missing=1
            fi
            if ! grep -qi "triggering delta" "$required_status"; then
              echo "ERROR: '$required_status' must record the alignment triggering delta."
              missing=1
            fi
            if ! grep -qi "triggering delta" "$required_worklog"; then
              echo "ERROR: '$required_worklog' must record the alignment triggering delta."
              missing=1
            fi
          fi

          if [[ "$missing" -ne 0 ]]; then
            echo "Guardrail failed. Update status/worklog and active checklist docs in this PR."
            exit 1
          fi

          echo "Guardrail OK: required docs updated."

  cmd-11-fast-checks:
    name: CMD-11 fast checks (stubs + unit)
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/core-api/requirements.txt -r apps/core-api/requirements-dev.txt
          pip install -r packages/db/requirements.txt -r packages/db/requirements-test.txt
          pip install -r packages/shared-types/requirements.txt -r packages/shared-types/requirements-test.txt

      - name: Run CMD-11 equivalent
        run: make PYTHON=python test

  paper-verification-gate:
    name: Paper verification gate (contract + invariant harness)
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    needs: [cmd-11-fast-checks]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/core-api/requirements.txt -r apps/core-api/requirements-dev.txt
          pip install -r packages/db/requirements.txt -r packages/db/requirements-test.txt
          pip install -r packages/shared-types/requirements.txt -r packages/shared-types/requirements-test.txt

      - name: Run paper contract and invariant harness
        run: |
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -p pytest_asyncio.plugin -q tests/unit/paper

      - name: Generate paper verification snapshot artifact
        run: |
          python scripts/generate_paper_verification_snapshot.py --output paper/artifacts/verification_snapshot.json

      - name: Upload paper verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-verification-report
          path: |
            paper/artifacts/verification_snapshot.json
          if-no-files-found: error

  cmd-12-integration:
    name: CMD-12 integration matrix (unit + integration)
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/core-api/requirements.txt -r apps/core-api/requirements-dev.txt
          pip install -r packages/db/requirements.txt -r packages/db/requirements-test.txt
          pip install -r packages/shared-types/requirements.txt -r packages/shared-types/requirements-test.txt

      - name: Start infrastructure
        run: make up

      - name: Run CMD-12 equivalent
        run: make PYTHON=python test-all-guarded

      - name: Cleanup
        if: always()
        run: make down

  observability-gate:
    name: Observability gate (artifact SLO checks)
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run observability SLO guardrails
        run: make PYTHON=python check-observability-slos

  architecture-coherence:
    name: Architecture coherence gate
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run architecture coherence check
        run: make PYTHON=python check-architecture-coherence

  objective-metrics-gate:
    name: Objective metrics gate
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    needs: [cmd-12-integration]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/core-api/requirements.txt -r apps/core-api/requirements-dev.txt
          pip install -r packages/db/requirements.txt -r packages/db/requirements-test.txt
          pip install -r packages/shared-types/requirements.txt -r packages/shared-types/requirements-test.txt

      - name: Start infrastructure
        run: make up

      - name: Temporal preflight
        run: scripts/preflight_temporal.sh

      - name: Run objective metrics gate
        run: make PYTHON=python check-objective-metrics

      - name: Run observability snapshot synthesis
        run: make PYTHON=python check-observability-snapshot

      - name: Publish objective metrics summary
        if: always()
        run: |
          if [ -f Docs/implementation/reports/objective_metrics_dashboard.md ]; then
            cat Docs/implementation/reports/objective_metrics_dashboard.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f Docs/implementation/reports/observability_snapshot_dashboard.md ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat Docs/implementation/reports/observability_snapshot_dashboard.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload objective metrics artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: objective-metrics-report
          path: |
            Docs/implementation/reports/objective_metrics_latest.json
            Docs/implementation/reports/objective_metrics_dashboard.md
            Docs/implementation/reports/objective_metrics_history.jsonl
            Docs/implementation/reports/objective_metrics_timeline.md
          if-no-files-found: error

      - name: Upload observability snapshot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observability-snapshot-report
          path: |
            Docs/implementation/reports/observability_snapshot_latest.json
            Docs/implementation/reports/observability_snapshot_dashboard.md
          if-no-files-found: error

      - name: Cleanup
        if: always()
        run: make down

  cmd-13-e2e-critical-flow:
    name: CMD-13 e2e critical-flow gate
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    needs: [cmd-12-integration]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/core-api/requirements.txt -r apps/core-api/requirements-dev.txt
          pip install -r packages/db/requirements.txt -r packages/db/requirements-test.txt
          pip install -r packages/shared-types/requirements.txt -r packages/shared-types/requirements-test.txt

      - name: Start infrastructure
        run: make up

      - name: Temporal preflight
        run: scripts/preflight_temporal.sh

      - name: Run deterministic e2e critical-flow gate (warning budget enforced)
        run: E2E_CRITICAL_WARNING_BUDGET=40 make PYTHON=python test-e2e-critical

      - name: Cleanup
        if: always()
        run: make down

  cmd-37-38-dash-data-quality:
    name: CMD-37/38 Dash data-quality gate
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    needs: [cmd-11-fast-checks]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dash/data-quality dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r dash_app/requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Dash data-quality validation (CMD-37)
        run: python -m dash_app.data.validation --repo-root . --output /tmp/agora-dash-validation.json

      - name: Run Dash loader/validation regression tests (CMD-38)
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -p pytest_asyncio.plugin -q tests/test_data_validation.py tests/test_loaders_smoke.py

      - name: Upload Dash validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dash-data-quality-report
          path: /tmp/agora-dash-validation.json
          if-no-files-found: error

  cmd-30-ui-smoke-cross-browser:
    name: CMD-30 UI smoke cross-browser (${{ matrix.browser }})
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    needs: [cmd-12-integration]
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/core-api/requirements.txt -r apps/core-api/requirements-dev.txt
          pip install -r packages/db/requirements.txt -r packages/db/requirements-test.txt
          pip install -r packages/shared-types/requirements.txt -r packages/shared-types/requirements-test.txt

      - name: Install web dependencies
        run: npm --prefix apps/web ci

      - name: Install Playwright browser runtime
        run: |
          cd apps/web
          npx playwright install --with-deps ${{ matrix.browser }}

      - name: Start infrastructure
        run: make up

      - name: Start Core API
        run: |
          cd apps/core-api
          python main.py > ../../core_api.log 2>&1 &
          echo "API_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for Core API health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health >/dev/null; then
              echo "Core API is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Core API failed to become healthy in time"
          exit 1

      - name: Start web dev server
        run: |
          npm --prefix apps/web run dev -- --host 0.0.0.0 --port 3000 > web_dev.log 2>&1 &
          echo "WEB_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for web login page
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/login >/dev/null; then
              echo "Web UI is reachable"
              exit 0
            fi
            sleep 2
          done
          echo "Web UI failed to become reachable in time"
          exit 1

      - name: Run UI browser smoke
        run: AGORA_SMOKE_BROWSER=${{ matrix.browser }} npm --prefix apps/web run smoke:artifact-viewer

      - name: Upload UI smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-${{ matrix.browser }}
          path: /tmp/agora-smoke-artifact-viewer-${{ matrix.browser }}.png
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        run: |
          if [ -n "${WEB_PID:-}" ]; then
            kill "$WEB_PID" || true
          fi
          if [ -n "${API_PID:-}" ]; then
            kill "$API_PID" || true
          fi
          make down

  cmd-31-ui-smoke-mobile:
    name: CMD-31 UI smoke mobile tabs
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    needs: [cmd-12-integration]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/core-api/requirements.txt -r apps/core-api/requirements-dev.txt
          pip install -r packages/db/requirements.txt -r packages/db/requirements-test.txt
          pip install -r packages/shared-types/requirements.txt -r packages/shared-types/requirements-test.txt

      - name: Install web dependencies
        run: npm --prefix apps/web ci

      - name: Install Playwright browser runtime
        run: |
          cd apps/web
          npx playwright install --with-deps chromium

      - name: Start infrastructure
        run: make up

      - name: Start Core API
        run: |
          cd apps/core-api
          python main.py > ../../core_api.log 2>&1 &
          echo "API_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for Core API health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health >/dev/null; then
              echo "Core API is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Core API failed to become healthy in time"
          exit 1

      - name: Start web dev server
        run: |
          npm --prefix apps/web run dev -- --host 0.0.0.0 --port 3000 > web_dev.log 2>&1 &
          echo "WEB_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for web login page
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/login >/dev/null; then
              echo "Web UI is reachable"
              exit 0
            fi
            sleep 2
          done
          echo "Web UI failed to become reachable in time"
          exit 1

      - name: Run UI mobile smoke
        run: AGORA_SMOKE_BROWSER=chromium AGORA_SMOKE_VIEWPORT=mobile npm --prefix apps/web run smoke:artifact-viewer

      - name: Upload UI mobile smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-mobile
          path: /tmp/agora-smoke-artifact-viewer-chromium-mobile.png
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        run: |
          if [ -n "${WEB_PID:-}" ]; then
            kill "$WEB_PID" || true
          fi
          if [ -n "${API_PID:-}" ]; then
            kill "$API_PID" || true
          fi
          make down

  cmd-13-nightly-full-suite:
    name: CMD-13 nightly full-suite gate
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_full_e2e == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/core-api/requirements.txt -r apps/core-api/requirements-dev.txt
          pip install -r packages/db/requirements.txt -r packages/db/requirements-test.txt
          pip install -r packages/shared-types/requirements.txt -r packages/shared-types/requirements-test.txt

      - name: Start infrastructure
        run: make up

      - name: Temporal preflight
        run: scripts/preflight_temporal.sh

      - name: Run full e2e suite (CMD-13) with warning budget
        run: E2E_FULL_WARNING_BUDGET=200 make PYTHON=python test-e2e

      - name: Cleanup
        if: always()
        run: make down

  release-tag-gate:
    name: Release tag gate (v* fail-closed)
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_release_gate == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/core-api/requirements.txt -r apps/core-api/requirements-dev.txt
          pip install -r packages/db/requirements.txt -r packages/db/requirements-test.txt
          pip install -r packages/shared-types/requirements.txt -r packages/shared-types/requirements-test.txt
          pip install -r dash_app/requirements.txt
          pip install pytest pytest-asyncio

      - name: Start infrastructure
        run: make up

      - name: Temporal preflight
        run: scripts/preflight_temporal.sh

      - name: Run release gate command set
        run: |
          make PYTHON=python test
          make PYTHON=python test-all-guarded
          E2E_CRITICAL_WARNING_BUDGET=40 make PYTHON=python test-e2e-critical
          E2E_FULL_WARNING_BUDGET=200 make PYTHON=python test-e2e
          python -m dash_app.data.validation --repo-root . --output /tmp/agora-dash-validation.json
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -p pytest_asyncio.plugin -q tests/test_data_validation.py tests/test_loaders_smoke.py

      - name: Verify release-readiness evidence files
        run: |
          test -f CHANGELOG.md
          test -f Docs/how_to/upgrade_notes_template.md
          test -f Docs/implementation/checklists/06_release_readiness.md
          test -f Docs/reference/release_workflow.md
          rg -n "M7 Release Operability Follow-Through|Tag-triggered release policy|CMD-13" Docs/implementation/checklists/06_release_readiness.md Docs/reference/release_workflow.md

      - name: Bundle release-readiness evidence
        if: always()
        run: |
          tar -czf /tmp/release-readiness-evidence.tgz \
            CHANGELOG.md \
            Docs/how_to/upgrade_notes_template.md \
            Docs/implementation/checklists/06_release_readiness.md \
            Docs/reference/release_workflow.md

      - name: Upload release gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-tag-gate-artifacts
          path: |
            /tmp/agora-dash-validation.json
            /tmp/release-readiness-evidence.tgz
          if-no-files-found: error

      - name: Cleanup
        if: always()
        run: make down

  smoke-test:
    name: Smoke test - boot stack and check health
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start infrastructure
        run: |
          cd infra
          docker compose up -d

      - name: Wait for services
        run: |
          echo "Waiting for services to be healthy..."
          sleep 30
          docker compose -f infra/docker-compose.yml ps

      - name: Install Python dependencies
        run: |
          cd apps/core-api
          pip install -r requirements.txt

      - name: Start Core API
        run: |
          cd apps/core-api
          python main.py &
          API_PID=$!
          echo "API_PID=$API_PID" >> $GITHUB_ENV
          sleep 5

      - name: Test health endpoint
        run: |
          response=$(curl -s http://localhost:8000/health)
          echo "Health check response: $response"
          if echo "$response" | grep -q "healthy"; then
            echo "✓ Health check passed"
          else
            echo "✗ Health check failed"
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: |
          if [ ! -z "$API_PID" ]; then
            kill $API_PID || true
          fi
          cd infra
          docker compose down -v
