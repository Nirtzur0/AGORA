name: CI

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      run_release_gate:
        description: 'Run release tag gate job'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      run_full_e2e:
        description: 'Run nightly full CMD-13 suite job'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      run_objective_gate:
        description: 'Run cmd-12-integration and objective-metrics-gate jobs'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      observability_sink_mode:
        description: 'External observability sink publish mode'
        required: false
        default: 'dry_run'
        type: choice
        options: ['disabled', 'dry_run', 'active']
      observability_sink_url:
        description: 'External observability sink URL override (optional)'
        required: false
        default: ''
        type: string

jobs:
  docs-guardrail:
    name: Docs guardrail (status/worklog + active checklist)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce docs updates when changing tests/CI/runtime
        shell: bash
        run: |
          set -euo pipefail

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"

          echo "Diff range:"
          echo "  base=$BASE_SHA"
          echo "  head=$HEAD_SHA"
          echo "Changed files:"
          echo "$CHANGED" | sed 's/^/  - /' || true

          needs_docs=0
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            if [[ "$f" == tests/* || "$f" == .github/workflows/* || "$f" == apps/core-api/* || "$f" == apps/worker/* || "$f" == packages/* || "$f" == infra/* || "$f" == scripts/* || "$f" == Docs/artifacts/* || "$f" == Makefile || "$f" == pytest.ini ]]; then
              needs_docs=1
            fi
          done <<< "$CHANGED"

          if [[ "$needs_docs" -eq 0 ]]; then
            echo "No tests/CI/runtime changes detected; guardrail not applicable."
            exit 0
          fi

          required_status="Docs/implementation/00_status.md"
          required_worklog="Docs/implementation/03_worklog.md"
          required_alignment="Docs/implementation/checklists/08_artifact_feature_alignment.md"

          missing=0
          if ! echo "$CHANGED" | grep -qx "$required_status"; then
            echo "ERROR: '$required_status' must be updated when changing tests/CI/runtime."
            missing=1
          fi
          if ! echo "$CHANGED" | grep -qx "$required_worklog"; then
            echo "ERROR: '$required_worklog' must be updated when changing tests/CI/runtime."
            missing=1
          fi

          checklist_updates="$(echo "$CHANGED" | grep -E '^Docs/implementation/checklists/.+\.md$' || true)"
          if [[ -z "$checklist_updates" ]]; then
            echo "ERROR: at least one file under Docs/implementation/checklists/ must be updated for active packet tracking."
            missing=1
          else
            echo "Checklist updates detected:"
            echo "$checklist_updates" | sed 's/^/  - /'
          fi

          reliability_changes="$(echo "$CHANGED" | grep -E '^(apps/core-api/(artifact_routes|draft_routes|evidence_resolver|phase_routes)\.py|apps/worker/(citation_check|main)\.py|tests/integration/core_api/(test_artifacts_exit|test_drafts|test_evidence_resolver)\.py|tests/integration/worker/(test_phase_machine|test_repo_ingestion)\.py|Docs/artifacts/(index\.json|README\.md))$' || true)"
          if [[ -n "$reliability_changes" ]]; then
            echo "Reliability-critical changes detected:"
            echo "$reliability_changes" | sed 's/^/  - /'
            if ! echo "$CHANGED" | grep -qx "$required_alignment"; then
              echo "ERROR: '$required_alignment' must be updated when reliability-critical files change."
              missing=1
            fi
          fi

          alignment_checkpoint="Docs/implementation/checklists/07_alignment_review.md"
          if echo "$CHANGED" | grep -qx "$alignment_checkpoint"; then
            echo "Alignment checkpoint update detected; enforcing trigger metadata."
            if ! grep -q "Triggering delta:" "$alignment_checkpoint"; then
              echo "ERROR: '$alignment_checkpoint' must include 'Triggering delta:'."
              missing=1
            fi
            if ! grep -q "Recommended next non-redundant packet:" "$alignment_checkpoint"; then
              echo "ERROR: '$alignment_checkpoint' must include 'Recommended next non-redundant packet:'."
              missing=1
            fi
            if ! grep -qi "triggering delta" "$required_status"; then
              echo "ERROR: '$required_status' must record the alignment triggering delta."
              missing=1
            fi
            if ! grep -qi "triggering delta" "$required_worklog"; then
              echo "ERROR: '$required_worklog' must record the alignment triggering delta."
              missing=1
            fi
          fi

          if [[ "$missing" -ne 0 ]]; then
            echo "Guardrail failed. Update status/worklog and active checklist docs in this PR."
            exit 1
          fi

          echo "Guardrail OK: required docs updated."

  cmd-11-fast-checks:
    name: CMD-11 fast checks (stubs + unit)
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/core-api/requirements.txt -r apps/core-api/requirements-dev.txt
          pip install -r packages/db/requirements.txt -r packages/db/requirements-test.txt
          pip install -r packages/shared-types/requirements.txt -r packages/shared-types/requirements-test.txt

      - name: Run CMD-11 equivalent
        run: make PYTHON=python test

  paper-verification-gate:
    name: Paper verification gate (contract + invariant harness)
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    needs: [cmd-11-fast-checks]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/core-api/requirements.txt -r apps/core-api/requirements-dev.txt
          pip install -r packages/db/requirements.txt -r packages/db/requirements-test.txt
          pip install -r packages/shared-types/requirements.txt -r packages/shared-types/requirements-test.txt

      - name: Run paper contract and invariant harness
        run: |
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -p pytest_asyncio.plugin -q tests/unit/paper

      - name: Generate paper verification snapshot artifact
        run: |
          python scripts/generate_paper_verification_snapshot.py --output paper/artifacts/verification_snapshot.json

      - name: Upload paper verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-verification-report
          path: |
            paper/artifacts/verification_snapshot.json
          if-no-files-found: error

  cmd-12-integration:
    name: CMD-12 integration matrix (unit + integration)
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_objective_gate == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/core-api/requirements.txt -r apps/core-api/requirements-dev.txt
          pip install -r packages/db/requirements.txt -r packages/db/requirements-test.txt
          pip install -r packages/shared-types/requirements.txt -r packages/shared-types/requirements-test.txt

      - name: Start infrastructure
        run: make up

      - name: Run CMD-12 equivalent
        run: make PYTHON=python test-all-guarded

      - name: Cleanup
        if: always()
        run: make down

  observability-gate:
    name: Observability gate (artifact SLO checks)
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run observability SLO guardrails
        run: make PYTHON=python check-observability-slos

  architecture-coherence:
    name: Architecture coherence gate
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run architecture coherence check
        run: make PYTHON=python check-architecture-coherence

  objective-metrics-gate:
    name: Objective metrics gate
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_objective_gate == 'true')
    runs-on: ubuntu-latest
    needs: [cmd-12-integration]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/core-api/requirements.txt -r apps/core-api/requirements-dev.txt
          pip install -r packages/db/requirements.txt -r packages/db/requirements-test.txt
          pip install -r packages/shared-types/requirements.txt -r packages/shared-types/requirements-test.txt

      - name: Start infrastructure
        run: make up

      - name: Temporal preflight
        run: scripts/preflight_temporal.sh

      - name: Run objective metrics gate
        run: make PYTHON=python check-objective-metrics

      - name: Run observability snapshot synthesis
        run: make PYTHON=python check-observability-snapshot

      - name: Publish objective and observability payload to external sink
        if: always()
        env:
          OBS_SINK_URL_FROM_INPUT: ${{ github.event.inputs.observability_sink_url }}
          OBS_SINK_URL_FROM_SECRET: ${{ secrets.OBSERVABILITY_SINK_URL }}
        run: |
          mode="${{ github.event.inputs.observability_sink_mode }}"
          if [ -z "$mode" ]; then
            mode="dry_run"
          fi

          sink_url="${OBS_SINK_URL_FROM_INPUT:-}"
          if [ -z "$sink_url" ]; then
            sink_url="${OBS_SINK_URL_FROM_SECRET:-}"
          fi

          python scripts/publish_observability_sink.py \
            --mode "$mode" \
            --sink-url "$sink_url" \
            --fail-open true \
            --workflow "${{ github.workflow }}" \
            --job "objective-metrics-gate" \
            --event-name "${{ github.event_name }}" \
            --ref "${{ github.ref }}" \
            --sha "${{ github.sha }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --objective-latest Docs/implementation/reports/objective_metrics_latest.json \
            --objective-history Docs/implementation/reports/objective_metrics_history.jsonl \
            --observability-latest Docs/implementation/reports/observability_snapshot_latest.json \
            --report /tmp/objective-observability-sink-report.json \
            --summary-markdown /tmp/objective-observability-sink-summary.md

      - name: Publish objective metrics summary
        if: always()
        run: |
          if [ -f Docs/implementation/reports/objective_metrics_dashboard.md ]; then
            cat Docs/implementation/reports/objective_metrics_dashboard.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f Docs/implementation/reports/observability_snapshot_dashboard.md ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat Docs/implementation/reports/observability_snapshot_dashboard.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f /tmp/objective-observability-sink-summary.md ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/objective-observability-sink-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload objective metrics artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: objective-metrics-report
          path: |
            Docs/implementation/reports/objective_metrics_latest.json
            Docs/implementation/reports/objective_metrics_dashboard.md
            Docs/implementation/reports/objective_metrics_history.jsonl
            Docs/implementation/reports/objective_metrics_timeline.md
          if-no-files-found: error

      - name: Upload observability snapshot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observability-snapshot-report
          path: |
            Docs/implementation/reports/observability_snapshot_latest.json
            Docs/implementation/reports/observability_snapshot_dashboard.md
            /tmp/objective-observability-sink-report.json
            /tmp/objective-observability-sink-summary.md
          if-no-files-found: error

      - name: Cleanup
        if: always()
        run: make down

  cmd-13-e2e-critical-flow:
    name: CMD-13 e2e critical-flow gate
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    needs: [cmd-12-integration]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/core-api/requirements.txt -r apps/core-api/requirements-dev.txt
          pip install -r packages/db/requirements.txt -r packages/db/requirements-test.txt
          pip install -r packages/shared-types/requirements.txt -r packages/shared-types/requirements-test.txt

      - name: Start infrastructure
        run: make up

      - name: Temporal preflight
        run: scripts/preflight_temporal.sh

      - name: Run deterministic e2e critical-flow gate (warning budget enforced)
        run: E2E_CRITICAL_WARNING_BUDGET=40 make PYTHON=python test-e2e-critical

      - name: Cleanup
        if: always()
        run: make down

  cmd-37-38-dash-data-quality:
    name: CMD-37/38 Dash data-quality gate
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    needs: [cmd-11-fast-checks]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dash/data-quality dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/core-api/requirements.txt -r apps/core-api/requirements-dev.txt
          pip install -r dash_app/requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Dash data-quality validation (CMD-37)
        run: python -m dash_app.data.validation --repo-root . --output /tmp/agora-dash-validation.json

      - name: Run Dash loader/validation regression tests (CMD-38)
        run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -p pytest_asyncio.plugin -q tests/test_data_validation.py tests/test_loaders_smoke.py

      - name: Upload Dash validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dash-data-quality-report
          path: /tmp/agora-dash-validation.json
          if-no-files-found: error

  cmd-30-ui-smoke-cross-browser:
    name: CMD-30 UI smoke cross-browser (${{ matrix.browser }})
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    needs: [cmd-12-integration]
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/core-api/requirements.txt -r apps/core-api/requirements-dev.txt
          pip install -r packages/db/requirements.txt -r packages/db/requirements-test.txt
          pip install -r packages/shared-types/requirements.txt -r packages/shared-types/requirements-test.txt

      - name: Install web dependencies
        run: npm --prefix apps/web ci

      - name: Install Playwright browser runtime
        run: |
          cd apps/web
          npx playwright install --with-deps ${{ matrix.browser }}

      - name: Start infrastructure
        run: make up

      - name: Apply DB migrations and seed roles
        run: make PYTHON=python migrate-up

      - name: Start Core API
        run: |
          cd apps/core-api
          python main.py > ../../core_api.log 2>&1 &
          echo "API_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for Core API health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health >/dev/null; then
              echo "Core API is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Core API failed to become healthy in time"
          exit 1

      - name: Start web dev server
        run: |
          npm --prefix apps/web run dev -- --host 0.0.0.0 --port 3000 > web_dev.log 2>&1 &
          echo "WEB_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for web login page
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/login >/dev/null; then
              echo "Web UI is reachable"
              exit 0
            fi
            sleep 2
          done
          echo "Web UI failed to become reachable in time"
          exit 1

      - name: Run UI browser smoke
        run: AGORA_SMOKE_BROWSER=${{ matrix.browser }} npm --prefix apps/web run smoke:artifact-viewer

      - name: Upload UI smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-${{ matrix.browser }}
          path: /tmp/agora-smoke-artifact-viewer-${{ matrix.browser }}.png
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        run: |
          if [ -n "${WEB_PID:-}" ]; then
            kill "$WEB_PID" || true
          fi
          if [ -n "${API_PID:-}" ]; then
            kill "$API_PID" || true
          fi
          make down

  cmd-31-ui-smoke-mobile:
    name: CMD-31 UI smoke mobile tabs
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    needs: [cmd-12-integration]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/core-api/requirements.txt -r apps/core-api/requirements-dev.txt
          pip install -r packages/db/requirements.txt -r packages/db/requirements-test.txt
          pip install -r packages/shared-types/requirements.txt -r packages/shared-types/requirements-test.txt

      - name: Install web dependencies
        run: npm --prefix apps/web ci

      - name: Install Playwright browser runtime
        run: |
          cd apps/web
          npx playwright install --with-deps chromium

      - name: Start infrastructure
        run: make up

      - name: Apply DB migrations and seed roles
        run: make PYTHON=python migrate-up

      - name: Start Core API
        run: |
          cd apps/core-api
          python main.py > ../../core_api.log 2>&1 &
          echo "API_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for Core API health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health >/dev/null; then
              echo "Core API is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Core API failed to become healthy in time"
          exit 1

      - name: Start web dev server
        run: |
          npm --prefix apps/web run dev -- --host 0.0.0.0 --port 3000 > web_dev.log 2>&1 &
          echo "WEB_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for web login page
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/login >/dev/null; then
              echo "Web UI is reachable"
              exit 0
            fi
            sleep 2
          done
          echo "Web UI failed to become reachable in time"
          exit 1

      - name: Run UI mobile smoke
        run: AGORA_SMOKE_BROWSER=chromium AGORA_SMOKE_VIEWPORT=mobile npm --prefix apps/web run smoke:artifact-viewer

      - name: Upload UI mobile smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-mobile
          path: /tmp/agora-smoke-artifact-viewer-chromium-mobile.png
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        run: |
          if [ -n "${WEB_PID:-}" ]; then
            kill "$WEB_PID" || true
          fi
          if [ -n "${API_PID:-}" ]; then
            kill "$API_PID" || true
          fi
          make down

  cmd-13-nightly-full-suite:
    name: CMD-13 nightly full-suite gate
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_full_e2e == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NIGHTLY_RUNTIME_TARGET_MINUTES: "90"
      NIGHTLY_TIMEOUT_MINUTES: "180"
      NIGHTLY_FLAKE_RETRY_BUDGET: "1"
      NIGHTLY_RETRY_SLEEP_SECONDS: "20"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/core-api/requirements.txt -r apps/core-api/requirements-dev.txt
          pip install -r packages/db/requirements.txt -r packages/db/requirements-test.txt
          pip install -r packages/shared-types/requirements.txt -r packages/shared-types/requirements-test.txt

      - name: Start infrastructure
        run: make up

      - name: Temporal preflight
        run: scripts/preflight_temporal.sh

      - name: Run full e2e suite (CMD-13) with warning budget + flake retry policy
        run: |
          max_attempts=$((NIGHTLY_FLAKE_RETRY_BUDGET + 1))
          attempt=1
          start_epoch=$(date +%s)

          while true; do
            echo "cmd-13-nightly-full-suite attempt ${attempt}/${max_attempts}"
            if E2E_FULL_WARNING_BUDGET=200 make PYTHON=python test-e2e; then
              end_epoch=$(date +%s)
              elapsed_seconds=$((end_epoch - start_epoch))
              echo "runtime_policy_summary gate=cmd-13-nightly-full-suite status=pass attempts_used=${attempt} retry_budget=${NIGHTLY_FLAKE_RETRY_BUDGET} timeout_minutes=${NIGHTLY_TIMEOUT_MINUTES} runtime_target_minutes=${NIGHTLY_RUNTIME_TARGET_MINUTES} elapsed_seconds=${elapsed_seconds}" | tee /tmp/cmd-13-nightly-runtime-policy.txt
              break
            fi

            if [ "$attempt" -ge "$max_attempts" ]; then
              end_epoch=$(date +%s)
              elapsed_seconds=$((end_epoch - start_epoch))
              echo "runtime_policy_summary gate=cmd-13-nightly-full-suite status=fail attempts_used=${attempt} retry_budget=${NIGHTLY_FLAKE_RETRY_BUDGET} timeout_minutes=${NIGHTLY_TIMEOUT_MINUTES} runtime_target_minutes=${NIGHTLY_RUNTIME_TARGET_MINUTES} elapsed_seconds=${elapsed_seconds}" | tee /tmp/cmd-13-nightly-runtime-policy.txt
              exit 1
            fi

            attempt=$((attempt + 1))
            echo "Transient failure detected; retrying in ${NIGHTLY_RETRY_SLEEP_SECONDS}s (flake retry budget ${NIGHTLY_FLAKE_RETRY_BUDGET})."
            sleep "${NIGHTLY_RETRY_SLEEP_SECONDS}"
          done

      - name: Ensure nightly runtime policy summary exists
        if: always()
        run: |
          if [ ! -f /tmp/cmd-13-nightly-runtime-policy.txt ]; then
            echo "runtime_policy_summary gate=cmd-13-nightly-full-suite status=fail attempts_used=0 retry_budget=${NIGHTLY_FLAKE_RETRY_BUDGET} timeout_minutes=${NIGHTLY_TIMEOUT_MINUTES} runtime_target_minutes=${NIGHTLY_RUNTIME_TARGET_MINUTES} elapsed_seconds=0" > /tmp/cmd-13-nightly-runtime-policy.txt
          fi

      - name: Build nightly runtime+flake trend artifacts
        if: always()
        run: |
          python scripts/build_ci_runtime_trend.py \
            --summary-file /tmp/cmd-13-nightly-runtime-policy.txt \
            --latest /tmp/cmd-13-nightly-runtime-trend-latest.json \
            --history /tmp/cmd-13-nightly-runtime-trend-history.jsonl \
            --dashboard /tmp/cmd-13-nightly-runtime-trend-dashboard.md

      - name: Add nightly runtime trend dashboard to job summary
        if: always()
        run: |
          if [ -f /tmp/cmd-13-nightly-runtime-trend-dashboard.md ]; then
            cat /tmp/cmd-13-nightly-runtime-trend-dashboard.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish nightly runtime trend payload to external sink
        if: always()
        env:
          OBS_SINK_URL_FROM_INPUT: ${{ github.event.inputs.observability_sink_url }}
          OBS_SINK_URL_FROM_SECRET: ${{ secrets.OBSERVABILITY_SINK_URL }}
        run: |
          mode="${{ github.event.inputs.observability_sink_mode }}"
          if [ -z "$mode" ]; then
            mode="dry_run"
          fi

          sink_url="${OBS_SINK_URL_FROM_INPUT:-}"
          if [ -z "$sink_url" ]; then
            sink_url="${OBS_SINK_URL_FROM_SECRET:-}"
          fi

          python scripts/publish_observability_sink.py \
            --mode "$mode" \
            --sink-url "$sink_url" \
            --fail-open true \
            --workflow "${{ github.workflow }}" \
            --job "cmd-13-nightly-full-suite" \
            --event-name "${{ github.event_name }}" \
            --ref "${{ github.ref }}" \
            --sha "${{ github.sha }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --runtime-trend-latest /tmp/cmd-13-nightly-runtime-trend-latest.json \
            --runtime-trend-dashboard /tmp/cmd-13-nightly-runtime-trend-dashboard.md \
            --runtime-policy-summary /tmp/cmd-13-nightly-runtime-policy.txt \
            --report /tmp/cmd-13-nightly-observability-sink-report.json \
            --summary-markdown /tmp/cmd-13-nightly-observability-sink-summary.md

      - name: Add nightly sink publish summary to job summary
        if: always()
        run: |
          if [ -f /tmp/cmd-13-nightly-observability-sink-summary.md ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/cmd-13-nightly-observability-sink-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish nightly runtime policy and trend artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmd-13-nightly-runtime-trend
          path: |
            /tmp/cmd-13-nightly-runtime-policy.txt
            /tmp/cmd-13-nightly-runtime-trend-latest.json
            /tmp/cmd-13-nightly-runtime-trend-history.jsonl
            /tmp/cmd-13-nightly-runtime-trend-dashboard.md
            /tmp/cmd-13-nightly-observability-sink-report.json
            /tmp/cmd-13-nightly-observability-sink-summary.md
          if-no-files-found: error

      - name: Cleanup
        if: always()
        run: make down

  release-tag-gate:
    name: Release tag gate (v* fail-closed)
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_release_gate == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 210
    env:
      RELEASE_RUNTIME_TARGET_MINUTES: "120"
      RELEASE_TIMEOUT_MINUTES: "210"
      RELEASE_FLAKE_RETRY_BUDGET: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/core-api/requirements.txt -r apps/core-api/requirements-dev.txt
          pip install -r packages/db/requirements.txt -r packages/db/requirements-test.txt
          pip install -r packages/shared-types/requirements.txt -r packages/shared-types/requirements-test.txt
          pip install -r dash_app/requirements.txt
          pip install pytest pytest-asyncio

      - name: Start infrastructure
        run: make up

      - name: Temporal preflight
        run: scripts/preflight_temporal.sh

      - name: Run release gate command set
        run: |
          make PYTHON=python test
          make PYTHON=python test-all-guarded
          E2E_CRITICAL_WARNING_BUDGET=40 make PYTHON=python test-e2e-critical

          release_cmd13_start_epoch=$(date +%s)
          if E2E_FULL_WARNING_BUDGET=200 make PYTHON=python test-e2e; then
            release_cmd13_end_epoch=$(date +%s)
            release_cmd13_elapsed_seconds=$((release_cmd13_end_epoch - release_cmd13_start_epoch))
            echo "runtime_policy_summary gate=release-tag-gate status=pass attempts_used=1 retry_budget=${RELEASE_FLAKE_RETRY_BUDGET} timeout_minutes=${RELEASE_TIMEOUT_MINUTES} runtime_target_minutes=${RELEASE_RUNTIME_TARGET_MINUTES} elapsed_seconds=${release_cmd13_elapsed_seconds}" | tee /tmp/release-tag-runtime-policy.txt
          else
            release_cmd13_end_epoch=$(date +%s)
            release_cmd13_elapsed_seconds=$((release_cmd13_end_epoch - release_cmd13_start_epoch))
            echo "runtime_policy_summary gate=release-tag-gate status=fail attempts_used=1 retry_budget=${RELEASE_FLAKE_RETRY_BUDGET} timeout_minutes=${RELEASE_TIMEOUT_MINUTES} runtime_target_minutes=${RELEASE_RUNTIME_TARGET_MINUTES} elapsed_seconds=${release_cmd13_elapsed_seconds}" | tee /tmp/release-tag-runtime-policy.txt
            exit 1
          fi

          python -m dash_app.data.validation --repo-root . --output /tmp/agora-dash-validation.json
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -p pytest_asyncio.plugin -q tests/test_data_validation.py tests/test_loaders_smoke.py

      - name: Enforce release runtime and flake budget policy
        run: |
          test -f /tmp/release-tag-runtime-policy.txt
          elapsed_seconds=$(sed -n 's/.*elapsed_seconds=\([0-9][0-9]*\).*/\1/p' /tmp/release-tag-runtime-policy.txt)
          attempts_used=$(sed -n 's/.*attempts_used=\([0-9][0-9]*\).*/\1/p' /tmp/release-tag-runtime-policy.txt)
          target_seconds=$((RELEASE_RUNTIME_TARGET_MINUTES * 60))
          max_attempts=$((RELEASE_FLAKE_RETRY_BUDGET + 1))

          if [ -z "$elapsed_seconds" ] || [ -z "$attempts_used" ]; then
            echo "Could not parse release runtime policy summary."
            exit 1
          fi

          if [ "$attempts_used" -gt "$max_attempts" ]; then
            echo "Release flake retry budget exceeded (attempts=${attempts_used}, max=${max_attempts})."
            exit 1
          fi

          if [ "$elapsed_seconds" -gt "$target_seconds" ]; then
            echo "Release runtime target exceeded (${elapsed_seconds}s > ${target_seconds}s). Promotion remains blocked pending maintainer review."
            exit 1
          fi

      - name: Ensure release runtime policy summary exists
        if: always()
        run: |
          if [ ! -f /tmp/release-tag-runtime-policy.txt ]; then
            echo "runtime_policy_summary gate=release-tag-gate status=fail attempts_used=0 retry_budget=${RELEASE_FLAKE_RETRY_BUDGET} timeout_minutes=${RELEASE_TIMEOUT_MINUTES} runtime_target_minutes=${RELEASE_RUNTIME_TARGET_MINUTES} elapsed_seconds=0" > /tmp/release-tag-runtime-policy.txt
          fi

      - name: Build release runtime+flake trend artifacts
        if: always()
        run: |
          python scripts/build_ci_runtime_trend.py \
            --summary-file /tmp/release-tag-runtime-policy.txt \
            --latest /tmp/release-tag-runtime-trend-latest.json \
            --history /tmp/release-tag-runtime-trend-history.jsonl \
            --dashboard /tmp/release-tag-runtime-trend-dashboard.md

      - name: Add release runtime trend dashboard to job summary
        if: always()
        run: |
          if [ -f /tmp/release-tag-runtime-trend-dashboard.md ]; then
            cat /tmp/release-tag-runtime-trend-dashboard.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish release runtime trend payload to external sink
        if: always()
        env:
          OBS_SINK_URL_FROM_INPUT: ${{ github.event.inputs.observability_sink_url }}
          OBS_SINK_URL_FROM_SECRET: ${{ secrets.OBSERVABILITY_SINK_URL }}
        run: |
          mode="${{ github.event.inputs.observability_sink_mode }}"
          if [ -z "$mode" ]; then
            mode="dry_run"
          fi

          sink_url="${OBS_SINK_URL_FROM_INPUT:-}"
          if [ -z "$sink_url" ]; then
            sink_url="${OBS_SINK_URL_FROM_SECRET:-}"
          fi

          python scripts/publish_observability_sink.py \
            --mode "$mode" \
            --sink-url "$sink_url" \
            --fail-open true \
            --workflow "${{ github.workflow }}" \
            --job "release-tag-gate" \
            --event-name "${{ github.event_name }}" \
            --ref "${{ github.ref }}" \
            --sha "${{ github.sha }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --runtime-trend-latest /tmp/release-tag-runtime-trend-latest.json \
            --runtime-trend-dashboard /tmp/release-tag-runtime-trend-dashboard.md \
            --runtime-policy-summary /tmp/release-tag-runtime-policy.txt \
            --report /tmp/release-tag-observability-sink-report.json \
            --summary-markdown /tmp/release-tag-observability-sink-summary.md

      - name: Add release sink publish summary to job summary
        if: always()
        run: |
          if [ -f /tmp/release-tag-observability-sink-summary.md ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/release-tag-observability-sink-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify release-readiness evidence files
        run: |
          test -f CHANGELOG.md
          test -f Docs/how_to/upgrade_notes_template.md
          test -f Docs/implementation/checklists/06_release_readiness.md
          test -f Docs/reference/release_workflow.md
          if command -v rg >/dev/null 2>&1; then
            rg -n "M7 Release Operability Follow-Through|Tag-triggered release policy|CMD-13" Docs/implementation/checklists/06_release_readiness.md Docs/reference/release_workflow.md
          else
            grep -En "M7 Release Operability Follow-Through|Tag-triggered release policy|CMD-13" Docs/implementation/checklists/06_release_readiness.md Docs/reference/release_workflow.md
          fi

      - name: Bundle release-readiness evidence
        if: always()
        run: |
          tar -czf /tmp/release-readiness-evidence.tgz \
            CHANGELOG.md \
            Docs/how_to/upgrade_notes_template.md \
            Docs/implementation/checklists/06_release_readiness.md \
            Docs/reference/release_workflow.md

      - name: Upload release gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-tag-gate-artifacts
          path: |
            /tmp/agora-dash-validation.json
            /tmp/release-tag-runtime-policy.txt
            /tmp/release-tag-runtime-trend-latest.json
            /tmp/release-tag-runtime-trend-history.jsonl
            /tmp/release-tag-runtime-trend-dashboard.md
            /tmp/release-tag-observability-sink-report.json
            /tmp/release-tag-observability-sink-summary.md
            /tmp/release-readiness-evidence.tgz
          if-no-files-found: error

      - name: Cleanup
        if: always()
        run: make down

  smoke-test:
    name: Smoke test - boot stack and check health
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start infrastructure
        run: |
          cd infra
          docker compose up -d

      - name: Wait for services
        run: |
          echo "Waiting for services to be healthy..."
          sleep 30
          docker compose -f infra/docker-compose.yml ps

      - name: Install Python dependencies
        run: |
          cd apps/core-api
          pip install -r requirements.txt

      - name: Start Core API
        run: |
          cd apps/core-api
          python main.py &
          API_PID=$!
          echo "API_PID=$API_PID" >> $GITHUB_ENV
          sleep 5

      - name: Test health endpoint
        run: |
          response=$(curl -s http://localhost:8000/health)
          echo "Health check response: $response"
          if echo "$response" | grep -q "healthy"; then
            echo "✓ Health check passed"
          else
            echo "✗ Health check failed"
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: |
          if [ ! -z "$API_PID" ]; then
            kill $API_PID || true
          fi
          cd infra
          docker compose down -v
